<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediKart | Header and Navbar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md">
        <div class="flex flex-wrap justify-between items-center gap-3">
            <!-- Logo -->
            <h1 class="text-2xl font-bold">Medi<span class="text-yellow-300">Kart</span></h1>
            <!-- Navigation -->
            <nav class="flex flex-wrap gap-6 font-medium">
                <a href="#" class="hover:text-yellow-300">Home</a>
                <a href="#" class="hover:text-yellow-300">About</a>
                <!-- Dropdown -->
                <div class="relative group">
                    <button class="hover:text-yellow-300">
                        Medicines &#9662;
                    </button>
                    <div class="hidden group-hover:block absolute bg-white text-gray-800 rounded-lg shadow-lg py-2 w-44 z-10">
                        <a href="#" class="block px-4 py-2 hover:bg-teal-50 hover:text-teal-700">
                            Fever &amp; Pain
                        </a>
                        <a href="#" class="block px-4 py-2 hover:bg-teal-50 hover:text-teal-700">
                            Cold &amp; Cough
                        </a>
                        <a href="#" class="block px-4 py-2 hover:bg-teal-50 hover:text-teal-700">
                            Vitamins
                        </a>
                        <a href="#" class="block px-4 py-2 hover:bg-teal-50 hover:text-teal-700">
                            Health Devices
                        </a>
                    </div>
                </div>
                <a href="#" class="hover:text-yellow-300">Contact</a>
                <a href="#" class="bg-white text-teal-700 px-3 rounded hover:bg-yellow-300">Login</a>
            </nav>
        </div>
    </header>
</body>
</html>
